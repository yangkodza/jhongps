    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; }
        #map { height: 100vh; width: 100%; position: absolute; top: 0; bottom: 0; z-index: 1; }
        
        /* กล่องแสดงผลด้านล่างดีไซน์โมเดิร์น */
        .info-box {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); z-index: 1000; text-align: center;
            width: 85%; max-width: 360px; backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* หน้าปัดเรือนไมล์ดิจิทัล */
        .speedometer-container {
            display: flex; align-items: center; justify-content: center; margin: 10px 0;
        }
        .speed-badge {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #22c55e; padding: 8px 18px; border-radius: 50px;
            font-size: 24px; font-weight: 900; font-family: monospace;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            border: 2px solid #22c55e; text-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }
        .speed-unit { font-size: 12px; color: #94a3b8; margin-left: 5px; font-weight: normal; }

        /* ปุ่มหลักแฝงความเร็ว */
        .check-btn {
            background: linear-gradient(135deg, #e11d48, #be123c); color: white;
            border: none; padding: 12px 20px; font-size: 16px; font-weight: bold;
            border-radius: 14px; cursor: pointer; width: 100%; margin-top: 10px;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3); transition: all 0.2s;
        }
        .check-btn:active { transform: scale(0.98); }

        /* ปุ่มนำทางไปหาพี่ยาง (โผล่เมื่อกดเช็คแล้ว) */
        .navigate-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white;
            border: none; padding: 12px 20px; font-size: 16px; font-weight: bold;
            border-radius: 14px; cursor: pointer; width: 100%; margin-top: 8px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); transition: all 0.2s;
            display: none; align-items: center; justify-content: center; gap: 8px;
            text-decoration: none;
        }
        .navigate-btn:active { transform: scale(0.98); }

        /* สไตล์ของลูกศรนำทางบนแผนที่ */
        .navigation-arrow {
            font-size: 40px;
            text-align: center;
            line-height: 40px;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.4));
            transition: transform 0.4s ease-out; /* หมุนเลี้ยวแบบนุ่มนวลสไตล์แอปนำทาง */
            transform-origin: center center;
        }

        .leaflet-top.leaflet-left { left: auto !important; right: 15px !important; top: 15px !important; }
    </style>
</head>
