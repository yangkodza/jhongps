<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แฟนส่องไรเดอร์ 💖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        .info-box {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: white; padding: 15px 25px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; text-align: center;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div class="info-box">
        <h3 style="margin:0 0 5px 0;">สถานะแฟนตอนนี้</h3>
        <div id="rider-status" style="font-weight: bold; color: #e11d48;">กำลังเชื่อมต่อสัญญาณ...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDy-R01JXQm-tf1jQLKwz6u1PuKDCF3zWk",
            authDomain: "find-80ef2.firebaseapp.com",
            projectId: "find-80ef2",
            storageBucket: "find-80ef2.firebasestorage.app",
            messagingSenderId: "109312481378",
            appId: "1:109312481378:android:2d95511e75ff32c39dd93b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const riderUUID = "BP2A.250605.031.A3"; 

        // 🔧 [จุดพิกัดบ้านพี่ซัง 🏡] ใส่พิกัดบ้านพี่ตรงนี้เหมือนเดิมเลยครับ
        const homeLatitude = 12.6100;  
        const homeLongitude = 102.1100; 

        // สูตรคำนวณระยะห่างผิวโลก (Haversine Formula) คืนค่าเป็นเมตร
        function getDistanceInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        const map = L.map('map', { zoomControl: false }).setView([12.6100, 102.1100], 15);
        
        // 🗺️ เปลี่ยนสกินแผนที่ใหม่: ใช้ระบบ Stadia Maps (OSM Bright) ตัวนี้จะดึงชื่อร้านค้า ร้านอาหาร คาเฟ่ 
        // สถานที่ท่องเที่ยว โรงพยาบาล และปั๊มน้ำมันขึ้นมาโชว์บนแผนที่ชัดเจนมาก แฟนพี่ซังดูรู้เรื่องแน่นอนครับ
        L.tileLayer('https://tiles.stadiamaps.com/tiles/osm_bright/{z}/{x}/{y}{r}.png', {
            maxZoom: 20,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // วาดวงกลมรัศมีบ้าน 60 เมตร
        L.circle([homeLatitude, homeLongitude], {
            color: '#10b981', fillColor: '#10b981', fillOpacity: 0.12, radius: 60
        }).addTo(map);

        // 🔧 [จุดเพิ่มร้านค้า/ร้านอาหารประจำ 🍔] 
        // ถ้าพี่อยากฝังหมุดร้านค้าที่พี่ชอบไปรับงานบ่อยๆ ให้แฟนเห็นชัดๆ พี่ยอดพิกัดเพิ่มตรงกลุ่มนี้ได้เลยครับ!
        const shops = [
            { name: "จุดรับงาน Shopee 📦", lat: 12.6115, lon: 102.1120, icon: "🏪" },
            { name: "ร้านอาหารตามสั่งประจำ 🍛", lat: 12.6085, lon: 102.1080, icon: "🍔" },
            { name: "ปั๊มน้ำมันแวะพักรถ ⛽", lat: 12.6150, lon: 102.1150, icon: "⛽" }
        ];

        // วาดหมุดร้านค้าประจำลงแผนที่ค้างไว้เลย
        shops.forEach(shop => {
            const shopIcon = L.divIcon({ html: `<div style="font-size:24px;">${shop.icon}</div>`, className: '' });
            L.marker([shop.lat, shop.lon], { icon: shopIcon }).addTo(map)
             .bindPopup(`<b>${shop.name}</b>`); // แฟนจิ้มที่หมุดจะขึ้นชื่อร้านครับ
        });

        let riderMarker;

        onSnapshot(doc(db, "locations", riderUUID), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const pos = [data.latitude, data.longitude];

                const distance = getDistanceInMeters(data.latitude, data.longitude, homeLatitude, homeLongitude);

                if (distance <= 60) {
                    document.getElementById("rider-status").innerText = "กำลังพักผ่อน 🏡";
                    document.getElementById("rider-status").style.color = "#10b981";
                } else {
                    document.getElementById("rider-status").innerText = data.status;
                    document.getElementById("rider-status").style.color = "#e11d48";
                }

                const bikeIcon = L.divIcon({ html: data.icon || '🏍️💨', className: '', iconSize: [40, 40] });
                
                if (!riderMarker) {
                    riderMarker = L.marker(pos, { icon: bikeIcon }).addTo(map);
                } else {
                    riderMarker.setLatLng(pos);
                }
                map.panTo(pos);
            } else {
                document.getElementById("rider-status").innerText = "พี่ซังยังไม่ได้เปิดแอปส่งพิกัดครับ";
            }
        });
    </script>
</body>
</html>
