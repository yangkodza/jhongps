<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แฟนส่องไรเดอร์ 💖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        .info-box {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: white; padding: 15px 25px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; text-align: center;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div class="info-box">
        <h3 style="margin:0 0 5px 0;">สถานะแฟนตอนนี้</h3>
        <div id="rider-status" style="font-weight: bold; color: #e11d48;">กำลังเชื่อมต่อสัญญาณ...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDy-R01JXQm-tf1jQLKwz6u1PuKDCF3zWk",
            authDomain: "find-80ef2.firebaseapp.com",
            projectId: "find-80ef2",
            storageBucket: "find-80ef2.firebasestorage.app",
            messagingSenderId: "109312481378",
            appId: "1:109312481378:android:2d95511e75ff32c39dd93b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const riderUUID = "BP2A.250605.031.A3"; 

        // 🔧 [จุดแก้ไขสําคัญของพี่ยาง 🏡] ใส่พิกัด "บ้านของพี่" ตรงนี้เลยครับคราบบบ
        // เอาตัวเลขละติจูด ลองจิจูดของบ้านพี่มาสลับเปลี่ยนแทนเลขด้านล่างนี้ได้เลยครับพี่ยาง
        const homeLatitude = 12.6472326;  // 👈 เปลี่ยนเป็นละติจูดบ้านพี่
        const homeLongitude = 102.0947158; // 👈 เปลี่ยนเป็นลองจิจูดบ้านพี่

        // สูตรคำนวณระยะห่างผิวโลก (Haversine Formula) คืนค่าออกมาเป็น "เมตร"
        function getDistanceInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000; // รัศมีโลกเป็นเมตร
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; // ระยะทางหน่วยเป็นเมตร
        }

        const map = L.map('map', { zoomControl: false }).setView([13.7600, 100.5100], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // วาดวงกลมรัศมี 60 เมตรรอบบ้านจางๆ บนแผนที่ ให้แฟนเห็นขอบเขตพื้นที่บ้าน
        L.circle([homeLatitude, homeLongitude], {
            color: '#10b981', fillColor: '#10b981', fillOpacity: 0.15, radius: 60
        }).addTo(map);

        let riderMarker;

        onSnapshot(doc(db, "locations", riderUUID), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const pos = [data.latitude, data.longitude];

                // 🎯 แอบคำนวณระยะห่างระหว่าง "ตัวรถพี่ยางตอนนี้" กับ "ตัวบ้าน"
                const distance = getDistanceInMeters(data.latitude, data.longitude, homeLatitude, homeLongitude);

                // 🔎 เช็คเงื่อนไขรัศมี 60 เมตร
                if (distance <= 60) {
                    // ถ้าใกล้บ้านต่ำกว่า 60 เมตร บังคับแสดงสถานะพักผ่อนทันทีครับพี่!
                    document.getElementById("rider-status").innerText = "กำลังพักผ่อน 🏡";
                    document.getElementById("rider-status").style.color = "#10b981"; // เปลี่ยนตัวหนังสือเป็นสีเขียวสบายตา
                } else {
                    // ถ้านอกระยะ 60 เมตร ให้ดึงค่าปกติจากมือถือพี่มาโชว์
                    document.getElementById("rider-status").innerText = data.status;
                    document.getElementById("rider-status").style.color = "#e11d48"; // สีแดงปกติ
                }

                const bikeIcon = L.divIcon({ html: data.icon || '🏍️💨', className: '', iconSize: [40, 40] });
                
                if (!riderMarker) {
                    riderMarker = L.marker(pos, { icon: bikeIcon }).addTo(map);
                } else {
                    riderMarker.setLatLng(pos);
                }
                map.panTo(pos);
            } else {
                document.getElementById("rider-status").innerText = "พี่ยางยังไม่ได้เปิดแอปส่งพิกัดครับ";
            }
        });
    </script>
</body>
</html>
