<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag GPS Pro 🏍️</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; overflow: hidden; }
        
        /* 🗺️ คอนเทนเนอร์แผนที่เปิดครอบคลุมและทำการหมุนแบบนุ่มนวล */
        #map-container {
            width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1;
            overflow: hidden; background: #0f172a;
        }
        #map { 
            width: 100%; height: 100%; 
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1); /* หมุนแผนที่เลี้ยวตามรถแบบเนียนตา */
        }
        
        /* 🎛️ กล่องแสดงข้อมูลด้านล่าง */
        .info-box {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); z-index: 1000; text-align: center;
            width: 85%; max-width: 360px; backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* 🏎️ เรือนไมล์ดิจิทัลเรืองแสง */
        .speedometer-container { display: flex; align-items: center; justify-content: center; margin: 10px 0; }
        .speed-badge {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #22c55e; padding: 8px 22px; border-radius: 50px;
            font-size: 32px; font-weight: 900; font-family: monospace;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
            border: 2px solid #22c55e; text-shadow: 0 0 12px rgba(34, 197, 94, 0.6);
            transition: color 0.3s;
        }
        .speed-unit { font-size: 14px; color: #94a3b8; margin-left: 6px; font-weight: normal; text-shadow: none; }

        .check-btn {
            background: linear-gradient(135deg, #e11d48, #be123c); color: white;
            border: none; padding: 12px 20px; font-size: 16px; font-weight: bold;
            border-radius: 14px; cursor: pointer; width: 100%; margin-top: 10px;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3); transition: all 0.2s;
        }
        .check-btn:active { transform: scale(0.98); }

        .navigate-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white;
            border: none; padding: 12px 20px; font-size: 16px; font-weight: bold;
            border-radius: 14px; cursor: pointer; width: 100%; margin-top: 8px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); transition: all 0.2s;
            display: none; align-items: center; justify-content: center; gap: 8px;
            text-decoration: none;
        }

        /* 🧭 สไตล์ลูกศรนำทางตำแหน่งตัวรถ (ตรึงอยู่กลางจอเสมอตอนเลี้ยว) */
        .navigation-arrow {
            font-size: 42px; text-align: center; line-height: 42px;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.5));
        }

        .leaflet-top.leaflet-left { left: auto !important; right: 15px !important; top: 15px !important; }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>
    </div>
    
    <div class="info-box">
        <h3 style="margin:0 0 5px 0; color: #1e293b; font-size: 18px;">ระบบติดตามเรียลไทม์ 🏍️</h3>
        <div id="rider-status" style="font-weight: bold; color: #64748b; margin-bottom: 5px;">สแตนด์บายรับพิกัด</div>
        
        <div class="speedometer-container">
            <div class="speed-badge" id="speed-display">0<span class="speed-unit">กม./ชม.</span></div>
        </div>

        <button class="check-btn" id="btn-check" onclick="checkRiderLocation()">เช็คตำแหน่งพี่ยาง 🔍</button>
        <a href="#" target="_blank" class="navigate-btn" id="btn-navigate">🧭 ตามไปหาพี่ยาง</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, collection, addDoc, getDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDy-R01JXQm-tf1jQLKwz6u1PuKDCF3zwk",
            authDomain: "find-80ef2.firebaseapp.com",
            projectId: "find-80ef2",
            storageBucket: "find-80ef2.firebasestorage.app",
            messagingSenderId: "109312481378",
            appId: "1:109312481378:android:2d95511e75ff32c39dd93b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const riderUUID = "BP2A.250605.031.A3"; 
        const homeLatitude = 12.647361;  
        const homeLongitude = 102.094667; 

        function getDistanceInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([homeLatitude, homeLongitude], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        L.circle([homeLatitude, homeLongitude], { color: '#10b981', fillColor: '#10b981', fillOpacity: 0.12, radius: 80 }).addTo(map);

        let riderMarker;
        let unsubscribeLive = null; 
        let liveTimeout = null;

        async function triggerNativePhoneSound() {
            try {
                await fetch('https://fcm.googleapis.com/fcm/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'key=AIzaSyDy-R01JXQm-tf1jQLKwz6u1PuKDCF3zwk' },
                    body: JSON.stringify({
                        "to": "/topics/rider_uuid_BP2A.250605.031.A3",
                        "priority": "high",
                        "notification": {
                            "title": "🔔 แฟนกดดูพิกัดสดแล้วคราบบบ!",
                            "body": "สัญญาณยิงตรงถึงกระเป๋าเสื้อเรียบร้อย",
                            "sound": "default"
                        }
                    })
                });
            } catch (e) { console.error("FCM Error: ", e); }
        }

        window.checkRiderLocation = async function() {
            const btn = document.getElementById("btn-check");
            const navBtn = document.getElementById("btn-navigate");
            if (unsubscribeLive) { unsubscribeLive(); clearTimeout(liveTimeout); }

            btn.innerText = "🔴 โหมดนำทางเรียลไทม์...";
            btn.style.background = "linear-gradient(135deg, #10b981, #059669)"; 
            btn.disabled = true;

            try {
                const locSnap = await getDoc(doc(db, "locations", riderUUID));
                if (locSnap.exists()) {
                    const locData = locSnap.data();
                    const mapShotUrl = `https://static-maps.yandex.ru/1.x/?lang=th_TH&ll=${locData.longitude},${locData.latitude}&z=16&l=sat,skl&size=450,400&pt=${locData.longitude},${locData.latitude},pm2rdm`;
                    await addDoc(collection(db, "stats"), {
                        device_id: riderUUID, checked_at: serverTimestamp(),
                        display_time: new Date().toLocaleString('th-TH', { hour12: false }),
                        map_image: mapShotUrl, latitude: locData.latitude, longitude: locData.longitude
                    });
                    await triggerNativePhoneSound();
                }
            } catch (err) { console.error(err); }

            // 🛰️ ท่อรับข้อมูลสด ยืดหยุ่น ไวต่อแรงคันเร่งรถ
            unsubscribeLive = onSnapshot(doc(db, "locations", riderUUID), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const pos = [data.latitude, data.longitude];
                    const distance = getDistanceInMeters(data.latitude, data.longitude, homeLatitude, homeLongitude);

                    // 1. ตรวจสอบสถานะการจอดพัก
                    if (distance <= 80) {
                        document.getElementById("rider-status").innerText = "กำลังพักผ่อน 🏡";
                        document.getElementById("rider-status").style.color = "#10b981";
                    } else {
                        document.getElementById("rider-status").innerText = data.status || "กำลังขับขี่มอเตอร์ไซค์ 🏍️💨";
                        document.getElementById("rider-status").style.color = data.status && data.status.includes('อยู่ที่') ? "#10b981" : "#e11d48";
                    }

                    // 2. 🏎️ แก้ไขเรือนไมล์จอดนิ่งค้าง: ตรวจเช็คค่าดิบ แปลงเป็นตัวเลขทันที
                    let currentSpeed = 0;
                    if (data.speed) {
                        // ดึงเฉพาะตัวเลขออกมาคำนวณ ป้องกันอักขระแปลกปลอมค้างกล่อง
                        const parsed = parseFloat(data.speed.replace(/[^0-9.]/g, ''));
                        currentSpeed = isNaN(parsed) ? 0 : Math.round(parsed);
                    }
                    
                    const speedDisplayEl = document.getElementById("speed-display");
                    speedDisplayEl.innerHTML = `${currentSpeed}<span class="speed-unit">กม./ชม.</span>`;
                    
                    // หากความเร็วเป็น 0 เปลี่ยนสีตัวเลขเรือนไมล์เป็นสีเทาแจ้งว่าจอดสนิท
                    if (currentSpeed === 0) {
                        speedDisplayEl.style.color = "#94a3b8"; 
                    } else {
                        speedDisplayEl.style.color = "#22c55e"; // บิดคันเร่งแล้วไมล์เด้งเขียวซิ่งทันที
                    }

                    // 3. ปุ่มยิงเข้าแอปนำทางภายนอก
                    if (data.latitude && data.longitude) {
                        navBtn.href = `https://www.google.com/maps/search/?api=1&query=${data.latitude},${data.longitude}`;
                        navBtn.style.display = "flex";
                    }

                    // 4. 🧭 ระบบแอปนำทางสากล: หมุนพื้นหลังแผนที่ (Map) ตามทิศหัวรถจริง!
                    const currentHeading = (data.heading !== undefined && data.heading !== null) ? parseFloat(data.heading) : 0;
                    
                    // เพื่อให้หน้ารถพุ่งขึ้นด้านบนหน้าจอเสมอ (แบบ Google Maps) 
                    // เราต้องจับตัวแผนที่หมุนสวนทางมุมเข็มทิศรถ (-heading) 
                    const mapElement = document.getElementById('map');
                    mapElement.style.transform = `rotate(${-currentHeading}deg)`;

                    // ตรึงไอคอนลูกศรไว้ตรงกลางเพื่อให้หน้าจอนำทางหันหน้าตามทิศการขี่ของพี่จริงๆ
                    const navigationArrowIcon = L.divIcon({ 
                        html: `<div class="navigation-arrow" style="transform: rotate(${currentHeading}deg);">🔽</div>`, 
                        className: '', iconSize: [50, 50], iconAnchor: [25, 25]
                    });
                    
                    if (!riderMarker) { 
                        riderMarker = L.marker(pos, { icon: navigationArrowIcon }).addTo(map); 
                    } else { 
                        riderMarker.setLatLng(pos);
                        riderMarker.setIcon(navigationArrowIcon);
                    }
                    
                    // สั่งให้กล้องโฟกัสกลางจุดรถวิ่งตลอดทาง
                    map.setView(pos, map.getZoom(), { animate: true });
                }
            });

            // ปรับเวลาล็อกส่องสด 10 นาที เต็มอิ่มจุใจ
            liveTimeout = setTimeout(() => {
                if (unsubscribeLive) { unsubscribeLive(); unsubscribeLive = null; }
                btn.innerText = "เช็คตำแหน่งพี่ยาง 🔍";
                btn.style.background = "linear-gradient(135deg, #e11d48, #be123c)";
                btn.disabled = false;
                navBtn.style.display = "none";
                // รีเซ็ตแผนที่กลับสู่มุมมองทิศเหนือปกติเมื่อหมดเวลาส่อง
                document.getElementById('map').style.transform = 'rotate(0deg)';
            }, 600000); 
        }
    </script>
</body>
</html>
