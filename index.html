<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แฟนส่องไรเดอร์ 💖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        .info-box {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: white; padding: 15px 25px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; text-align: center;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div class="info-box">
        <h3 style="margin:0 0 5px 0;">สถานะแฟนตอนนี้</h3>
        <div id="rider-status" style="font-weight: bold; color: #e11d48;">กำลังเชื่อมต่อสัญญาณ...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 🔧 [จุดแก้ไขที่ 1] วางคีย์ Firebase ของพี่ตรงนี้เหมือนเดิมเลยครับ
       const firebaseConfig = {
  apiKey: "AIzaSyDy-R01JXQm-tf1jQLKwz6u1PuKDCF3zWk",
  authDomain: "find-80ef2.firebaseapp.com",
  projectId: "find-80ef2",
  storageBucket: "find-80ef2.firebasestorage.app",
  messagingSenderId: "109312481378",
  appId: "1:109312481378:android:2d95511e75ff32c39dd93b"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 🔧 [จุดล็อกรหัสประจำเครื่อง] ตั้งให้ตรงกับ UUID ของพี่ (เดี่ยวเราจะได้ค่านี้จากแอปฝั่งพี่ครับ)
        const riderUUID = "BP2A.250605.031.A3"; 

        // สร้างแผนที่ตั้งค่าเริ่มต้น
        const map = L.map('map', { zoomControl: false }).setView([13.7600, 100.5100], 15);

        // 🗺️ เปลี่ยนตรงนี้: ใช้สกินแผนที่ถนนสีสว่างละมุน ตามาตรฐานอ้างอิง Google Maps (ซอย คอนโด วัด ขึ้นครบ)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let riderMarker;

        // 🎯 เปิดตาหูทิพย์ ส่องห้อง UUID ของพี่บนคลาวด์แบบเรียลไทม์
        onSnapshot(doc(db, "locations", riderUUID), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const pos = [data.latitude, data.longitude];

                // อัปเดตข้อความใต้จอให้แฟนเห็น
                document.getElementById("rider-status").innerText = data.status;

                // วาดหมุดมอเตอร์ไซค์ลงแผนที่
                const bikeIcon = L.divIcon({ html: data.icon || '🏍️💨', className: '', iconSize: [40, 40] });
                
                if (!riderMarker) {
                    riderMarker = L.marker(pos, { icon: bikeIcon }).addTo(map);
                } else {
                    riderMarker.setLatLng(pos);
                }
                map.panTo(pos); // ให้หน้าจอเลื่อนตามรถพี่อัตโนมัติ
            } else {
                document.getElementById("rider-status").innerText = "พี่ซังยังไม่ได้เปิดแอปส่งพิกัดครับ";
            }
        });
    </script>
</body>
</html>
