<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ดักรับเลขพิกัดเครื่องแม่ 🛰️</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .get-id-btn { background: #e11d48; color: white; border: none; padding: 20px; font-size: 20px; font-weight: bold; border-radius: 15px; cursor: pointer; width: 80%; max-width: 300px; box-shadow: 0 4px 15px rgba(225,29,72,0.4); }
    </style>
</head>
<body>
    <h2>ระบบลงทะเบียนพิกัดคุณแม่ 👵</h2>
    <p>ให้คุณแม่กดปุ่มสีแดงด้านล่าง 1 ครั้งคราบบบ</p>
    <button class="get-id-btn" onclick="sendMomUuidToFirebase()">🔴 กดลงทะเบียนตรงนี้เลยคราบบบ</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDy-R01JXQm-tf1jQLKwz6u1PuKDCF3zwk",
            authDomain: "find-80ef2.firebaseapp.com",
            projectId: "find-80ef2",
            storageBucket: "find-80ef2.firebasestorage.app",
            messagingSenderId: "109312481378",
            appId: "1:109312481378:android:2d95511e75ff32c39dd93b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.sendMomUuidToFirebase = async function() {
            try {
                // ดักจับรหัสเบราว์เซอร์และฮาร์ดแวร์จริงของเครื่องแม่ (UserAgent) ยิงขึ้นถังตรง ๆ พี่จะเห็นเลขทันที!
                const momDeviceCode = navigator.userAgent.replace(/[^a-zA-Z0-9]/g, "").substring(0, 15);
                await addDoc(collection(db, "stats"), {
                    device_id: "GET_MOM_UUID",
                    checked_at: serverTimestamp(),
                    display_time: new Date().toLocaleString('th-TH', { hour12: false }),
                    map_image: "MOM_PHONE_CODE_" + momDeviceCode
                });
                alert("ลงทะเบียนเลขเครื่องแม่ข้ามจังหวัดสำเร็จแล้วคราบบบพี่!");
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
